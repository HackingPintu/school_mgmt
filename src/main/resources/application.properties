# ==========================================
# 1. MySQL Database Configuration
# ==========================================
# createDatabaseIfNotExist=true ensures the DB schema is created if not already present
spring.datasource.url=jdbc:mysql://localhost:3306/school_mgmt?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Adyasha@04
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# 2. Hibernate / JPA Configuration
# ==========================================
# 'update' automatically updates/creates tables to match your entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# 3. Multipart File Upload Settings (For Photo BLOBs)
# ==========================================
# By default Spring Boot caps uploads at 1MB-10MB; increase this for student images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# 4. Swagger / OpenAPI UI Configuration
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha


