spring:
  application:
    name: student
    main:
      banner-mode: off # Disables banner so it doesn't corrupt stdout
    ai:
      mcp:
        server:
          name: order-mcp-server
          version: 1.0.0
          stdio: true # Enables standard input/output transport
logging:
  level:
    root: WARN # Keep logs out of stdout to avoid breaking JSON-RPC parsing

server:
  port: 8080
  servlet:
    context-path: /api/v1

# Define your custom endpoint name here
endpoint:
  academic-year: academicyear
  student: student
  teacher: teacher

