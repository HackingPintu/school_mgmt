<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Fee Collection Receipt - SSVM Badamba</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .receipt-container {
            width: 750px;
            max-width: 100%;
            background: #fff;
            border: 2px solid #2c3e50;
            padding: 25px 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .institution-info {
            text-align: center;
            flex-grow: 1;
            padding-left: 10px;
        }

        .institution-info h1 {
            font-size: 18px;
            color: #b30000;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .institution-info h3 {
            font-size: 13px;
            color: #444;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .institution-info p {
            font-size: 11px;
            color: #666;
        }

        /* Receipt Title */
        .receipt-title {
            text-align: center;
            background: #2c3e50;
            color: #fff;
            padding: 8px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-radius: 2px;
        }

        /* Receipt Number and Date */
        .meta-grid {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .meta-item span {
            font-weight: 600;
            color: #333;
        }

        /* Student Details */
        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .details-table th,
        .details-table td {
            border: 1px solid #bdc3c7;
            padding: 10px 14px;
            font-size: 14px;
        }

        .details-table th {
            background-color: #ecf0f1;
            color: #2c3e50;
            text-align: left;
            width: 40%;
        }

        .details-table td {
            color: #2c3e50;
            font-weight: 500;
        }

        /* Footer */
        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 30px;
            padding-top: 15px;
            gap: 15px;
        }

        .note {
            font-size: 11px;
            color: #7f8c8d;
            max-width: 55%;
            line-height: 1.6;
        }

        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px; /* Reduced gap */
        }

        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 15px; /* Reduced gap */
            padding-top: 10px;
            gap: 15px;
        }

        .signature-box {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .signature-img {
            width: 160px;
            height: 70px;
            object-fit: contain;
            display: block;
            margin-bottom: 5px;
        }

        .sig-line {
            height: 1px;
            border-top: 1px dashed #7f8c8d;
            width: 100%;
            margin: 6px 0;
            line-height: 1px;
            font-size: 1px;
        }

        .sig-title {
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
        }
    </style>
</head>

<body>

<div class="receipt-container">

    <!-- School Header -->
    <div class="header">
        <div class="logo-container">
            <img th:src="${schoolLogoBase64}" alt="School Logo"/>
        </div>
        <div class="institution-info">
            <h1>SARASWATI SISHU VIDYA MANDIRA, BADAMBA</h1>
            <h3>Sikshya Bikash Sansthan, Odisha</h3>
            <p></p>
        </div>
    </div>

    <!-- Receipt Title -->
    <div class="receipt-title">
        FEE COLLECTION RECEIPT
    </div>

    <!-- Receipt Information -->
    <div class="meta-grid">
        <div class="meta-item">
            Receipt No: <span th:text="${receiptNo}"></span>
        </div>
        <div class="meta-item">
            Date: <span th:text="${paymentDate}"></span>
        </div>
    </div>

    <!-- Student Details -->
    <table class="details-table">
        <tr>
            <th>Student Name</th>
            <td th:text="${studentName}"></td>
        </tr>
        <tr>
            <th>Class</th>
            <td th:text="${className}"></td>
        </tr>
        <tr>
            <th>Payment Mode</th>
            <td th:text="${paymentMode}"></td>
        </tr>
        <tr>
            <th>Amount Paid</th>
            <td>₹ <span th:text="${amountPaid}"></span>/-</td>
        </tr>
    </table>


    <!-- Footer and Signature -->
    <div class="footer-section">

        <div class="note">
            Note: This is a computer-generated receipt and does not require a physical signature.
        </div>

        <div class="signature-box">
            <img th:src="${signatureBase64}" alt="Authorized Signature" class="signature-img"/>

            <!-- Replaced <hr> with a styled <div> -->
            <div class="sig-line"></div>

            <span class="sig-title">Authorized Signatory</span>
        </div>

    </div>

</div>

</body>
</html>
